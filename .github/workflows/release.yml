name: Release

# Push a tag matching the plugin version (e.g. v1.0.1 or 1.0.1) to publish it on WordPress.org
# and attach the zip to a GitHub release. Needs the SVN_USERNAME and SVN_PASSWORD repository
# secrets, and only works once the plugin has been approved on WordPress.org.
on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, wp-cli
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Versions match the tag
        run: make version-check TAG=${{ github.ref_name }}

      - name: Version without the v prefix
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: make dist

      - name: Smoke test the build
        run: make smoke

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: inkstreak
          BUILD_DIR: build/inkstreak
          ASSETS_DIR: .wordpress-org
          VERSION: ${{ steps.version.outputs.version }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" inkstreak.zip --title "${{ github.ref_name }}" --generate-notes
